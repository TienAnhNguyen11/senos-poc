services:
  - type: web
    name: senos-poc
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false # paste your Anthropic API key in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret, no need to set it
      - key: PLATFORM_MONTHLY_CAPACITY
        value: "100000"
      - key: PORT
        value: "3000"
