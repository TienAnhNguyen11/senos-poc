services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    # Local dev keeps hot-reload via ts-node-dev against the bind-mounted source;
    # the image's own CMD (used by Render) runs the compiled build instead — see
    # Dockerfile.
    command: npx ts-node-dev --respawn src/server.ts
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/senos-poc
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PLATFORM_MONTHLY_CAPACITY: ${PLATFORM_MONTHLY_CAPACITY:-100000}
      PORT: 3000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo-data:
